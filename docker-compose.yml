# BlogManager Docker Compose
# Deploy at /opt/blogmanager/
# Run: docker compose up -d

services:
  blogmanager:
    image: ghcr.io/shanshui2024/service-blogmanager:latest
    container_name: blogmanager
    restart: unless-stopped
    ports:
      - "${PORT:-4321}:3000"
    environment:
      - ARC_CLIENT_ID=${ARC_CLIENT_ID}
      - ARC_CLIENT_SECRET=${ARC_CLIENT_SECRET}
      - BASE_URL=${BASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - NODE_ENV=production
    volumes:
      - blogmanager_sessions:/app/.sessions
      - blogmanager_repos:/app/.repos

volumes:
  blogmanager_sessions:
  blogmanager_repos:
