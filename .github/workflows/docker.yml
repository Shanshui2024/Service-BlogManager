name: Build, Push & Deploy

on:
  push:
    branches:
      - main
      - v3
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shanshui2024/service-blogmanager

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Verify SSH secrets
        run: |
          if [ -z "$HOST" ]; then echo "ERROR: SSH_HOST is empty or not set"; exit 1; fi
          if [ -z "$SSHUSER" ]; then echo "ERROR: SSH_USER is empty or not set"; exit 1; fi
          if [ -z "$SSHKEY" ]; then echo "ERROR: SSH_KEY is empty or not set"; exit 1; fi
          echo "All SSH secrets are present"
        env:
          HOST: ${{ secrets.SSH_HOST }}
          SSHUSER: ${{ secrets.SSH_USER }}
          SSHKEY: ${{ secrets.SSH_KEY }}
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd /opt/blogmanager
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF
